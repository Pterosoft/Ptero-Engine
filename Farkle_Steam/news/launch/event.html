<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Title; src: url("../../../Farkle/Website/dist/assets/title.ttf"); }
@font-face { font-family: Body; src: url("../../../Farkle/Website/dist/assets/body.ttf"); }
html, body { margin: 0; overflow: hidden; background: #120a05; }
.stage { position: relative; overflow: hidden; }
.shot { position: absolute; inset: 0; background: url("source.webp") no-repeat; background-size: cover; }
.shade { position: absolute; inset: 0; }
.content { position: absolute; }
.logo { display: block; filter: drop-shadow(0 6px 18px rgba(0,0,0,.7)); }
.kicker { font-family: Body, Georgia, serif; color: #e9c98f; letter-spacing: .32em; text-transform: uppercase; }
.headline { font-family: Title, Georgia, serif; color: #f6e6c4; line-height: 1; margin: 0; text-shadow: 0 4px 20px rgba(0,0,0,.8); }
.offer { display: flex; align-items: center; }
.badge { font-family: Title, Georgia, serif; background: #c9a466; color: #1c0f06; line-height: 1; border-radius: 6px;
  transform: rotate(-3deg); box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 0 0 0 3px rgba(28,15,6,.25); }
.offer-text { font-family: Body, Georgia, serif; color: #f6e6c4; line-height: 1.25; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
.offer-text b { color: #e9c98f; font-weight: normal; letter-spacing: .08em; text-transform: uppercase; display: block; }

/* 800x450 event cover: logo, headline and badge only */
.cover .stage { width: 800px; height: 450px; }
.cover .shot { background-position: 70% 50%; }
.cover .shade { background:
  linear-gradient(90deg, rgba(10,5,2,.88) 0%, rgba(10,5,2,.62) 32%, rgba(10,5,2,.12) 58%, rgba(10,5,2,0) 70%),
  radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,.35) 100%); }
.cover .content { left: 44px; top: 26px; }
.cover .logo { width: 300px; margin-left: -22px; }
.cover .headline { font-size: 62px; margin-top: -16px; }
.cover .offer { margin-top: 26px; gap: 18px; }
.cover .badge { font-size: 54px; padding: 10px 16px 7px; }
.cover .offer-text { font-size: 20px; }
.cover .offer-text b { font-size: 16px; }

/* 1920x622 event header: one wide row, fire kept clear on the right */
.header .stage { width: 1920px; height: 622px; }
.header .shot { background-size: 125% auto; background-position: 100% 64%; }
.header .shade { background:
  linear-gradient(90deg, rgba(10,5,2,.92) 0%, rgba(10,5,2,.82) 34%, rgba(10,5,2,.5) 52%, rgba(10,5,2,0) 68%),
  radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,.35) 100%); }
.header .content { left: 120px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 70px; }
.header .logo { width: 520px; margin-left: -30px; }
.header .kicker { font-size: 26px; margin: 0 0 14px 4px; }
.header .headline { font-size: 96px; }
.header .offer { margin-top: 30px; gap: 26px; }
.header .badge { font-size: 76px; padding: 14px 22px 10px; }
.header .offer-text { font-size: 32px; }
.header .offer-text b { font-size: 24px; }
.header .divider { width: 3px; align-self: stretch; background: linear-gradient(180deg, rgba(201,164,102,0), #c9a466, rgba(201,164,102,0)); }
</style></head>
<body>
<div class="stage">
  <div class="shot"></div>
  <div class="shade"></div>
  <div class="content">
    <img class="logo" src="../../library/en/library_logo_transparent.png">
    <div class="divider"></div>
    <div>
      <div class="kicker">The tavern is open</div>
      <h1 class="headline">Out Now<br>on Steam</h1>
      <div class="offer">
        <div class="badge">-15%</div>
        <div class="offer-text"><b>Launch discount</b>Grab a seat at the table</div>
      </div>
    </div>
  </div>
</div>
<script>
// ?layout=cover|header picks the size; the cover has no room for the kicker or divider
const layout = new URLSearchParams(location.search).get('layout') || 'cover';
document.body.className = layout;
if (layout === 'cover') document.querySelectorAll('.kicker,.divider').forEach(e => e.remove());
</script>
</body></html>
