<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Title; src: url("../../../Farkle/Website/dist/assets/title.ttf"); }
@font-face { font-family: Body; src: url("../../../Farkle/Website/dist/assets/body.ttf"); }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #120a05; }
.stage { position: relative; width: 1920px; height: 1080px; }
.shot { position: absolute; inset: 0; background: url("source.webp") center/cover; }
/* darken the left side for text, keep the fire on the right glowing */
.shade { position: absolute; inset: 0;
  background:
    linear-gradient(90deg, rgba(10,5,2,.85) 0%, rgba(10,5,2,.6) 28%, rgba(10,5,2,.15) 50%, rgba(10,5,2,0) 62%),
    linear-gradient(0deg, rgba(10,5,2,.5) 0%, rgba(10,5,2,0) 25%),
    radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 65%, rgba(0,0,0,.3) 100%); }
.content { position: absolute; left: 120px; top: 70px; width: 820px; }
.logo { width: 560px; margin-left: -40px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.7)); }
.kicker { font-family: Body, Georgia, serif; color: #e9c98f; letter-spacing: .32em; font-size: 30px;
  text-transform: uppercase; margin: -40px 0 18px 4px; }
.headline { font-family: Title, Georgia, serif; color: #f6e6c4; font-size: 100px; line-height: 1;
  margin: 0; text-shadow: 0 4px 20px rgba(0,0,0,.8); }
.rule { width: 360px; height: 3px; margin: 28px 0 30px 4px;
  background: linear-gradient(90deg, #c9a466, rgba(201,164,102,0)); }
.offer { display: flex; align-items: center; gap: 30px; }
.badge { font-family: Title, Georgia, serif; background: #c9a466; color: #1c0f06; font-size: 96px;
  line-height: 1; padding: 18px 28px 14px; border-radius: 6px; transform: rotate(-3deg);
  box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 0 0 0 3px rgba(28,15,6,.25); }
.offer-text { font-family: Body, Georgia, serif; color: #f6e6c4; font-size: 38px; line-height: 1.25;
  text-shadow: 0 2px 10px rgba(0,0,0,.8); }
.offer-text b { color: #e9c98f; font-weight: normal; letter-spacing: .08em; text-transform: uppercase; font-size: 28px; display: block; }
.cta { margin-top: 56px; display: flex; align-items: center; gap: 22px;
  font-family: Body, Georgia, serif; color: #f6e6c4; font-size: 34px; letter-spacing: .06em; }
.cta .btn { background: rgba(20,12,6,.75); border: 2px solid #c9a466; border-radius: 6px;
  padding: 14px 30px; display: flex; align-items: center; gap: 16px; }
.cta svg { width: 40px; height: 40px; }
.cta .small { color: #cdb48a; font-size: 26px; }
</style></head>
<body><div class="stage">
  <div class="shot"></div>
  <div class="shade"></div>
  <div class="content">
    <img class="logo" src="../../library/en/library_logo_transparent.png">
    <div class="kicker">The tavern is open</div>
    <h1 class="headline">Out Now<br>on Steam</h1>
    <div class="rule"></div>
    <div class="offer">
      <div class="badge">-15%</div>
      <div class="offer-text"><b>Launch discount</b>Grab a seat at the table</div>
    </div>
    <div class="cta">
      <div class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#c9a466" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l1 4H8z"/><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M12 11v6M9 14l3 3 3-3"/></svg>
        Available now on Steam
      </div>
      <span class="small">Limited time offer</span>
      </div>
</div>
</div></body></html>
